name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadr_test
          POSTGRES_PASSWORD: leadr_test_password
          POSTGRES_DB: leadr_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set environment variables for tests
        run: |
          echo "LEADR_API_KEY=test-api-key-for-ci" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://leadr_test:leadr_test_password@localhost:5432" >> $GITHUB_ENV

      - name: Run cargo test
        run: cargo test --verbose

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit and capture output
        id: audit
        continue-on-error: true
        run: |
          cargo audit --quiet --color never > audit-output.txt 2>&1 || true

      - name: Check if vulnerabilities found
        id: has-vulns
        if: github.event_name == 'pull_request'
        run: |
          # Only check for actual vulnerabilities, ignore warnings about unmaintained/yanked crates
          if grep -qE "(error:|vulnerability:|Crate:.*ID:)" audit-output.txt; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Read audit output
        id: audit-content
        if: github.event_name == 'pull_request' && steps.has-vulns.outputs.found == 'true'
        run: |
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat audit-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post audit results as PR comment
        if: github.event_name == 'pull_request' && steps.has-vulns.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-audit
          message: |
            ## 🔒 Security Audit Results

            <details>
            <summary>Click to view cargo audit output</summary>

            ```
            ${{ steps.audit-content.outputs.content }}
            ```

            </details>

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Set environment variables for tests
        run: |
          echo "LEADR_API_KEY=test-api-key-for-ci" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite::memory:" >> $GITHUB_ENV

      - name: Generate code coverage
        run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
